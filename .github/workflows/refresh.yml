name: Refresh Nifty50 earnings tracker

on:
  schedule:
    # 03:00 UTC daily = 08:30 IST, ahead of NSE market open.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.pipeline --continue-on-error

      - name: Run tests
        run: pytest -q

      - name: Commit refreshed data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Refresh Nifty50 earnings tracker data"
          git push
