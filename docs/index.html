<!DOCTYPE html><html><head><title>Quality Compounder Screener</title></head><body><h1>Quality Compounder Screener</h1><table id='stocks' border='1'></table><script>fetch('rankings.json').then(r=>r.json()).then(data=>{let html='<tr><th>Rank</th><th>Ticker</th><th>Score</th></tr>';data.forEach(x=>{html+=`<tr><td>${x.rank}</td><td>${x.ticker}</td><td>${x.score}</td></tr>`});document.getElementById('stocks').innerHTML=html;});</script></body></html>
